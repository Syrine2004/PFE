server:
  port: ${RECLAMATION_SERVICE_PORT:8089}

spring:
  application:
    name: reclamation-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-service:8888}"
  
  datasource:
    url: jdbc:postgresql://${DB_RECLAMATION_HOST:postgres-reclamation}:5432/${DB_RECLAMATION_NAME:residanat_reclamation_db}
    username: ${DB_RECLAMATION_USER:postgres}
    password: ${DB_RECLAMATION_PASSWORD:system}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    tn.sante.reclamation: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
