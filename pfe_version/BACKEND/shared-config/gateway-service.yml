spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: concours-service
          uri: http://concours-service:8082
          predicates:
            - Path=/api/concours/**
        - id: dossier-service
          uri: lb://dossier-service
          predicates:
            - Path=/api/dossiers/**
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
        - id: convocation-service
          uri: http://convocation-service:8086
          predicates:
            - Path=/api/convocations/**
        - id: resultat-service-candidat
          uri: http://resultat-service:8088
          predicates:
            - Path=/api/candidat/resultats/**
        - id: resultat-service-admin
          uri: http://resultat-service:8088
          predicates:
            - Path=/api/admin/resultats/**
        - id: resultat-service-general
          uri: http://resultat-service:8088
          predicates:
            - Path=/api/resultats/**
        - id: reclamation-service-admin
          uri: lb://reclamation-service
          predicates:
            - Path=/api/admin/reclamations/**
        - id: reclamation-service-candidat
          uri: lb://reclamation-service
          predicates:
            - Path=/api/reclamations/**
        - id: osrm-proxy
          uri: https://router.project-osrm.org
          predicates:
            - Path=/api/routing/**
          filters:
            - RewritePath=/api/routing/(?<segment>.*), /${segment}
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
              - "http://192.168.1.13:4200"
              - "https://amenities-tub-pen-commodities.trycloudflare.com"
            allowedMethods: 
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
