<div class="page-container">
    <div class="content-wrapper">
        <div class="page-header">
            <p class="section-tag">{{ 'INFO_PAGES.ACTUALITES.TAG' | translate }}</p>
            <h1 class="page-title">{{ 'INFO_PAGES.ACTUALITES.TITLE' | translate }}</h1>
            <p class="page-description">
                {{ 'INFO_PAGES.ACTUALITES.DESC' | translate }}
            </p>
        </div>

        <div class="articles-container">
            <button class="nav-button nav-prev" (click)="previousPage()" [disabled]="!canGoPrevious()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <div class="articles-grid">
                <article *ngFor="let article of articles" class="article-card">
                    <div class="card-image-placeholder">
                        <img [src]="article.image" [alt]="article.title" class="article-image">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <span class="category-badge">{{ article.category }}</span>
                            <div class="meta-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                    <line x1="16" y1="2" x2="16" y2="6" />
                                    <line x1="8" y1="2" x2="8" y2="6" />
                                    <line x1="3" y1="10" x2="21" y2="10" />
                                </svg>
                                {{ article.date }}
                            </div>
                        </div>
                        <h2 class="card-title">{{ article.title }}</h2>
                        <p class="card-excerpt">{{ article.excerpt }}</p>
                    </div>
                </article>
            </div>

            <button class="nav-button nav-next" (click)="nextPage()" [disabled]="!canGoNext()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <div class="pagination-info">
            <span>{{ currentPage + 1 }} / {{ totalPages }}</span>
        </div>
    </div>
</div>
