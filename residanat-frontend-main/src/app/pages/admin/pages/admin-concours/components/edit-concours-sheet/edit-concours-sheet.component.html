<div class="sheet-overlay" [class.open]="isOpen" (click)="onClose()">
    <div class="sheet-content" [class.open]="isOpen" (click)="$event.stopPropagation()">
        <ng-container *ngIf="formData">
            <!-- Hero Header -->
            <div class="hero-header">
                <div class="hero-content">
                    <div class="settings-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-settings-2">
                            <path d="M20 7h-9" />
                            <path d="M14 17H5" />
                            <circle cx="17" cy="17" r="3" />
                            <circle cx="7" cy="7" r="3" />
                        </svg>
                    </div>
                    <div class="title-group">
                        <h2 class="sheet-title">Configuration</h2>
                        <p class="sheet-desc">Modifiez les paramètres et la disponibilité de cette session de concours.
                        </p>
                        <div class="id-badge">
                            <span class="pulse-dot"></span>
                            ID: {{formData.id}}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scrollable Form Body -->
            <div class="sheet-body">
                <!-- Informations Générales -->
                <div class="form-card">
                    <div class="card-header">
                        <div class="icon-bg blue">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-info">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 16v-4" />
                                <path d="M12 8h.01" />
                            </svg>
                        </div>
                        <h4>Informations Générales</h4>
                    </div>

                    <div class="form-fields">
                        <div class="form-group">
                            <label>Titre du concours</label>
                            <input type="text" [(ngModel)]="formData.titre">
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>Année</label>
                                <input type="number" [(ngModel)]="formData.annee">
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <select [(ngModel)]="formData.type">
                                    <option value="National">National</option>
                                    <option value="Supplementaire">Supplémentaire</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Planification -->
                <div class="form-card">
                    <div class="card-header">
                        <div class="icon-bg indigo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-calendar">
                                <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                <line x1="16" x2="16" y1="2" y2="6" />
                                <line x1="8" x2="8" y1="2" y2="6" />
                                <line x1="3" x2="21" y1="10" y2="10" />
                            </svg>
                        </div>
                        <h4>Planification</h4>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Date de début</label>
                            <input type="date" [(ngModel)]="formData.dateDebut">
                        </div>
                        <div class="form-group">
                            <label>Date de fin</label>
                            <input type="date" [(ngModel)]="formData.dateFin">
                        </div>
                    </div>
                </div>

                <!-- Disponibilité -->
                <div class="form-card">
                    <div class="card-header">
                        <div class="icon-bg emerald">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-toggle-right">
                                <rect width="20" height="12" x="2" y="6" rx="6" ry="6" />
                                <circle cx="16" cy="12" r="2" />
                            </svg>
                        </div>
                        <h4>Disponibilité</h4>
                    </div>
                    <div class="availability-row" (click)="formData.actif = !formData.actif">
                        <div class="text">
                            <label>Activer le concours</label>
                            <p>Autorise la visibilité et l'accès pour les candidats sur le portail public.</p>
                        </div>
                        <div class="switch" [class.active]="formData.actif">
                            <div class="thumb"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="sheet-footer">
                <button class="btn-ghost" (click)="onClose()">Annuler</button>
                <button class="btn-primary" (click)="onSave()">Enregistrer la configuration</button>
            </div>
        </ng-container>
    </div>
</div>
