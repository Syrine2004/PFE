<div class="auth-page">

    <!-- Animated background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-wrapper auth-wrapper--lg">

        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                </svg>
            </div>
            <h1 class="auth-title">S'inscrire au concours</h1>
            <p class="auth-subtitle">Créez votre compte candidat en quelques étapes</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-card">
            <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="auth-form">

                <!-- Civilité & Nom -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="civilite" class="field-label">Civilité</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                            <select id="civilite" name="civilite" [(ngModel)]="civilite" class="auth-select">
                                <option value="" disabled selected>Civilité</option>
                                <option *ngFor="let c of civilites" [value]="c.value">{{ c.label }}</option>
                            </select>
                            <span class="select-chevron">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="nom" class="field-label">Nom</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                            <input id="nom" type="text" name="nom" [(ngModel)]="nom" placeholder="Votre nom"
                                class="auth-input" />
                        </div>
                    </div>
                </div>

                <!-- Prénom & Date de naissance -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="prenom" class="field-label">Prénom</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                            <input id="prenom" type="text" name="prenom" [(ngModel)]="prenom" placeholder="Votre prénom"
                                class="auth-input" />
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="date-naissance" class="field-label">Date de naissance</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                    <line x1="16" y1="2" x2="16" y2="6" />
                                    <line x1="8" y1="2" x2="8" y2="6" />
                                    <line x1="3" y1="10" x2="21" y2="10" />
                                </svg>
                            </span>
                            <input id="date-naissance" type="date" name="dateNaissance" [(ngModel)]="dateNaissance"
                                class="auth-input" />
                        </div>
                    </div>
                </div>

                <!-- Lieu de naissance & Nationalité -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="lieu-naissance" class="field-label">Lieu de naissance</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                                    <circle cx="12" cy="10" r="3" />
                                </svg>
                            </span>
                            <input id="lieu-naissance" type="text" name="lieuNaissance" [(ngModel)]="lieuNaissance"
                                placeholder="Ville de naissance" class="auth-input" />
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="nationalite" class="field-label">Nationalité</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                                    <line x1="4" y1="22" x2="4" y2="15" />
                                </svg>
                            </span>
                            <input id="nationalite" type="text" name="nationalite" [(ngModel)]="nationalite"
                                placeholder="Votre nationalité" class="auth-input" />
                        </div>
                    </div>
                </div>

                <!-- Adresse -->
                <div class="field-group">
                    <label for="adresse" class="field-label">Adresse</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>
                        </span>
                        <input id="adresse" type="text" name="adresse" [(ngModel)]="adresse"
                            placeholder="Votre adresse complète" class="auth-input" />
                    </div>
                </div>

                <!-- Numéro CIN & Téléphone -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="cin" class="field-label">Numéro CIN</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="20" height="14" x="2" y="5" rx="2" />
                                    <line x1="2" y1="10" x2="22" y2="10" />
                                </svg>
                            </span>
                            <input id="cin" type="text" name="cin" [(ngModel)]="cin" placeholder="00000000"
                                class="auth-input" />
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="telephone" class="field-label">Téléphone</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                                </svg>
                            </span>
                            <input id="telephone" type="tel" name="telephone" [(ngModel)]="telephone"
                                placeholder="55 000 000" class="auth-input" />
                        </div>
                    </div>
                </div>

                <!-- Email & Faculté -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="reg-email" class="field-label">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="20" height="16" x="2" y="4" rx="2" />
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                                </svg>
                            </span>
                            <input id="reg-email" type="email" name="email" [(ngModel)]="email"
                                placeholder="votre&#64;email.com" class="auth-input" autocomplete="email" />
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="faculte" class="field-label">Faculté de médecine</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
                                    <path d="M9 22v-4h6v4" />
                                    <path
                                        d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01" />
                                </svg>
                            </span>
                            <select id="faculte" name="faculte" [(ngModel)]="faculte" class="auth-select">
                                <option value="" disabled selected>Choisir votre faculté</option>
                                <option *ngFor="let f of facultes" [value]="f.value">{{ f.label }}</option>
                            </select>
                            <span class="select-chevron">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Passwords -->
                <div class="grid-2col">
                    <div class="field-group">
                        <label for="reg-password" class="field-label">Mot de passe</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </span>
                            <input id="reg-password" [type]="showPassword ? 'text' : 'password'" name="password"
                                [(ngModel)]="password" placeholder="Mot de passe" class="auth-input"
                                autocomplete="new-password" />
                            <button type="button" class="toggle-pw" (click)="togglePassword()" tabindex="-1">
                                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="confirm-password" class="field-label">Confirmer</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </span>
                            <input id="confirm-password" [type]="showConfirm ? 'text' : 'password'"
                                name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirmer"
                                class="auth-input" autocomplete="new-password" />
                            <button type="button" class="toggle-pw" (click)="toggleConfirm()" tabindex="-1">
                                <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    Créer mon compte
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </button>

            </form>
        </div>

        <!-- Footer link -->
        <p class="auth-footer">
            Déjà un compte ?
            <a routerLink="/connexion" class="auth-link">Se connecter</a>
        </p>

    </div>
</div>
